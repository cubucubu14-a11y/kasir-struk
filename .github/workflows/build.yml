name: Build APK Cireng Woi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Backup Custom Files
        run: |
          mkdir -p /tmp/backup
          cp main.dart /tmp/backup/main.dart
          if [ -f pubspec_custom.yaml ]; then cp pubspec_custom.yaml /tmp/backup/pubspec.yaml; fi

      - name: Generate Flutter Project Structure
        run: |
          flutter create . --org com.cirengwoi --project-name cireng_woi --platforms=android

      - name: Restore Custom Files
        run: |
          mkdir -p lib
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/main.dart main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml

      - name: Patch Kotlin Version to 1.9.24
        run: |
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*" apply false|id "org.jetbrains.kotlin.android" version "1.9.24" apply false|g' android/settings.gradle
          sed -i "s|ext.kotlin_version = '.*'|ext.kotlin_version = '1.9.24'|g" android/build.gradle
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  }
              }
          }
          EOF

      - name: Verify main.dart
        run: |
          echo "=== Isi lib/main.dart (10 baris pertama) ==="
          head -n 10 lib/main.dart
          echo "=== Cek baris WEB_APP_URL ==="
          grep -n "WEB_APP_URL" lib/main.dart || echo "TIDAK DITEMUKAN!"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cireng-woi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
